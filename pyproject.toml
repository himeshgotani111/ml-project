[project]
name = "cardioguard-ai"
version = "0.1.0"
description = "Cardiovascular Disease Risk Prediction Web Application"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "Flask-Cors==6.0.5",
    "joblib==1.6.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[tool.vercel]
entrypoint = "flask_app.app:app"
